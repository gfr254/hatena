name: Generate and publish Hatena post

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Hatenaへ実際に公開する"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate article with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: npm run generate

      - name: Upload generated article
        uses: actions/upload-artifact@v4
        with:
          name: generated-hatena-post
          path: out/post.json
          retention-days: 14

      - name: Publish to Hatena
        if: ${{ github.event_name == 'schedule' && vars.PUBLISH_ENABLED == 'true' || github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        env:
          HATENA_USER: ${{ secrets.HATENA_USER }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
        run: npm run publish